name: Assistant gateway contract and prompt sync

# 网关本身已废弃（见 server/assistant-gateway/README.md），但这个 job 不删 —— 它守的是
# **还活着的东西**，不是废弃代码：
#
#   1. tests/test_prompt_sync.py 直接读 mobile_app/lib/assistant/assistant_prompt.dart，
#      把 App 的 system 提示词与网关的 SYSTEM_PROMPT 逐字比对。App 的 BYOK 直连根本不
#      经过网关，所以 App 那份必须自带完整安全约束，而运行时没有任何东西会比对两份 ——
#      漂移只会表现为「两条在线路径里有一条的约束悄悄变松」。这是唯一的守卫。
#   2. App 的 assistant_settings_dialog.dart 在新建配置时默认选中「团队网关」，
#      GatewayAssistantProvider 因此仍是被用户默认走到的路径，它的契约测试不能停。
#
# 所以改动只是**把触发条件拆开**：服务端改一次不该顺带烧掉一次 ~10 分钟的 APK 构建。
on:
  push:
    branches: [main, codex/android-xiaozhi-prep]
    paths:
      - 'server/assistant-gateway/**'
      - 'protocol/xiaozhi-bridge.md'
      # test_prompt_sync.py 读的就是这个文件，它变了必须重跑：不能只盯着 server/。
      - 'mobile_app/lib/assistant/assistant_prompt.dart'
      - '.github/workflows/gateway-check.yml'
  pull_request:
    paths:
      - 'server/assistant-gateway/**'
      - 'protocol/xiaozhi-bridge.md'
      - 'mobile_app/lib/assistant/assistant_prompt.dart'
      - '.github/workflows/gateway-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/assistant-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/assistant-gateway/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
